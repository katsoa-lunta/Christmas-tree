/* ═══════════════ 工具 ═══════════════ */
function $(s,r){return (r||document).querySelector(s)}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function b64e(obj){
 var b=new TextEncoder().encode(JSON.stringify(obj)),s='';
 for(var i=0;i<b.length;i+=8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+8000));
 return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64d(str){
 var s=str.replace(/-/g,'+').replace(/_/g,'/'),bin=atob(s),b=new Uint8Array(bin.length);
 for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
 return JSON.parse(new TextDecoder().decode(b));
}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function cleanName(s){return String(s||'').replace(/[\r\n\t]/g,' ').trim().slice(0,12)}
function hw(y){return Math.max(0,Math.min(150,(y-55)/485*150))}
function notchPoint(n){if(n<=0)return IN_BOX;var y=TIER_Y[n-1]-20;return [CX+NOTCH_SIDE[n-1]*hw(y+8),y]}
function decoPoint(n){var y=TIER_Y[n-1]-16;return [CX+DECO_SIDE[n-1]*hw(y+8),y]}
function zoneOf(s){return s>=9?'top':s>=7?'front':s>=5?'bottom':'box'}
function spotFor(zone,i){
 if(i<4)return {pt:ZONE_SPOTS[zone][i],small:false};
 var b=ZONE_BACK[zone],j=(i-4)%b.length,r=BACK_RING[Math.floor((i-4)/b.length)%BACK_RING.length];
 return {pt:[b[j][0]+r[0],b[j][1]+r[1]],small:true};
}
function colorOf(name){var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;
 var hue=h%360;return ['hsl('+hue+',72%,58%)','hsl('+((hue+38)%360)+',68%,32%)']}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show')},2300)}
function copy(text,okMsg){
 var done=function(){toast(okMsg||'已复制，快发给朋友吧 🎄')};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fallback)}else fallback();
 function fallback(){var ta=el('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done()}catch(e){toast('复制失败，请手动长按选中')}ta.remove()}
}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');
 if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function pause(ms){return new Promise(function(r){setTimeout(r,ms)})}
var soundOn=true,AC=null;
function tone(freq,dur,type,vol,delay){
 if(!soundOn)return;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.05,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.15));
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(dur||.15)+.02);
 }catch(e){}
}
function sfxRight(n){tone(392+n*36,.16,'sine',.06);tone(588+n*40,.2,'sine',.04,.08)}
function sfxWrong(){tone(220,.18,'triangle',.045);tone(165,.24,'triangle',.04,.09)}
function sfxTap(){tone(660,.06,'sine',.035)}

 seq.forEach(function(f,i){tone(f,.28,'sine',.05,i*.12)})}

function questionsOf(q){
 if(q.c)return q.c.map(function(x){return {q:x[0],o:x[1],a:x[2]}});
 return q.q.map(function(x){var b=BANK[x[0]];return {q:b.q,o:b.o,a:x[1]}});
}
function quizId(code){return hash(code).slice(0,10)}
function packQuiz(q){return b64e(q)}
function unpackQuiz(code){var q=b64d(code);if(!q||q.v!==1||!q.n||!q.q)throw new Error('bad');return q}
function quizURL(code){return location.href.split('#')[0]+'#t='+code}
function scoreOf(q,answers){var qs=questionsOf(q),s=0;for(var i=0;i<qs.length;i++)if(answers[i]===qs[i].a)s++;return s}
function parseCustom(text){
 var lines=text.split('\n').map(function(l){return l.trim()}).filter(Boolean),out=[];
 lines.forEach(function(l){var p=l.split('|').map(function(x){return x.trim()}).filter(Boolean);
  if(p.length>=3)out.push([p[0],p.slice(1),0])});
 return out;
}
function friendsKey(id){return 'xm_friends_'+id}
function getFriends(id){return store(friendsKey(id))||[]}

function treeSVG(){

 s+='<defs><radialGradient id="glowG"><stop offset="0" stop-color="#FFF0AE" stop-opacity=".9"/><stop offset="1" stop-color="#FFD34D" stop-opacity="0"/></radialGradient>'+
    '<linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f9c6a"/><stop offset=".5" stop-color="#2b7150"/><stop offset="1" stop-color="#174632"/></linearGradient></defs>';
 // 地面雪堆
 s+='<path d="M0 596 Q60 574 120 592 Q190 610 250 586 Q290 574 320 590 L320 640 L0 640 Z" fill="#dfe9f7" opacity=".18"/>';
 // 树干

 // 五层松树
 var layers=[[55,200,55],[140,285,82],[225,370,108],[310,455,132],[395,540,152]];
 layers.forEach(function(L,i){
  var top=L[0],bot=L[1],hwid=L[2],d='M160 '+top+' L'+(160-hwid)+' '+bot;
  var seg=6,step=hwid*2/seg;
  for(var k=0;k<seg;k++){var x0=160-hwid+k*step,x1=x0+step;d+=' Q'+(x0+step/2)+' '+(bot+11)+' '+x1+' '+bot}
  d+=' L'+(160+hwid)+' '+bot+' Z';
  s+='<path d="'+d+'" fill="url(#tg)" stroke="#123a27" stroke-width="2" stroke-linejoin="round" opacity="'+(0.86+i*.03)+'"/>';
  s+='<path d="M160 '+top+' L'+(160-hwid)+' '+bot+'" fill="none" stroke="#5fbd86" stroke-width="2" opacity=".25"/>';
 });
 // 十层灯串
 var COLORS=['#FF5A55','#FFD34D','#7FD1AE','#FF7EB0','#7FB6FF'];
 for(var n=1;n<=10;n++){
  var y=TIER_Y[n-1],hwid=hw(y)*.9,x0=CX-hwid,x2=CX+hwid,y0=y-8,y1=y+14;

  var cnt=Math.max(3,Math.round(hwid*2/21));

   var tt=(j+.5)/cnt,bx=(1-tt)*(1-tt)*x0+2*(1-tt)*tt*CX+tt*tt*x2,
       by=(1-tt)*(1-tt)*y0+2*(1-tt)*tt*y1+tt*tt*y0,c=COLORS[(j+n)%COLORS.length];
   s+='<circle cx="'+bx.toFixed(1)+'" cy="'+(by+3).toFixed(1)+'" r="7" fill="'+c+'" opacity=".16"/>'+
      '<circle class="bulb" cx="'+bx.toFixed(1)+'" cy="'+(by+3).toFixed(1)+'" r="3.4" fill="'+c+'" style="animation-delay:-'+((j*7+n*3)%10)/5+'s"/>';
  }
  s+='</g>';
 }
 // 星星
 s+='<circle class="star-glow" cx="160" cy="30" r="52" fill="url(#glowG)"/>';
 s+='<path d="M160 6 L167 24 L186 26 L171 39 L176 58 L160 48 L144 58 L149 39 L134 26 L153 24 Z" fill="#FFD75E" stroke="#fff2bb" stroke-width="1.5"/>';
 // 礼物盒
 s+='<g><rect x="72" y="548" width="80" height="52" rx="5" fill="#c8324a" stroke="#8e1d30" stroke-width="2"/>'+
    '<rect x="68" y="540" width="88" height="14" rx="4" fill="#e04a5f" stroke="#8e1d30" stroke-width="2"/>'+
    '<rect x="105" y="540" width="14" height="60" fill="#ffd75e"/><rect x="68" y="553" width="88" height="12" fill="#ffd75e"/>'+
    '<path d="M112 540 Q92 528 100 520 Q110 516 112 540 Q114 516 124 520 Q132 528 112 540" fill="none" stroke="#ffd75e" stroke-width="4"/></g>';
 s+='</svg>';
 return s;

function makeTree(opts){

 var wrap=el('div','tree-wrap'),stage=el('div','tree-stage'+(opts.lit?' lit':'')+(opts.starred?' starred':''));
 stage.innerHTML=treeSVG()+'<div class="glow"></div>';
 var layer=el('div','tree-layer');stage.appendChild(layer);wrap.appendChild(stage);
 if(opts.lit)stage.querySelectorAll('.tier').forEach(function(g){g.classList.add('on')});
 var api={
  el:stage,wrap:wrap,layer:layer,
  place:function(node,pt){node.style.left=(pt[0]/W*100)+'%';node.style.top=(pt[1]/H*100)+'%';if(!node.parentNode)layer.appendChild(node);return node},
  light:function(n,on){var g=stage.querySelector('.tier[data-n="'+n+'"]');if(g)g.classList.toggle('on',on!==false)},
  lightAll:function(){stage.querySelectorAll('.tier').forEach(function(g){g.classList.add('on')});stage.classList.add('lit')},
  star:function(on){stage.classList.toggle('starred',on!==false)},
  sparkle:function(pt,num){
   num=num||8;
   for(var i=0;i<num;i++){var sp=el('i','spark');sp.style.left=(pt[0]/W*100)+'%';sp.style.top=(pt[1]/H*100)+'%';
    sp.style.background=['#FFD34D','#FF7EB0','#7FD1AE','#fff'][i%4];

    layer.appendChild(sp);setTimeout(function(x){x.remove()},820,sp)}
  },
  confetti:function(){

   for(var i=0;i<46;i++){var c=el('i','confetti');c.style.left=(Math.random()*100)+'%';

   if(txt)stage.appendChild(el('span','bubble',esc(txt)));return hd}
 };
 return api;
}

function startClimb(q,code,friend){
 var qs=questionsOf(q),id=quizId(code);
 var root=scene();
 var t=makeTree({});t.wrap.style.setProperty('--tree-h','min(42vh,380px)');root.appendChild(t.wrap);
 var host=t.host(q.av,'');
 var panel=el('div','card');
 var ribbon=el('div','ribbon','第 1 / '+qs.length+' 题');panel.appendChild(ribbon);
 var meter=el('div','meter');for(var m=0;m<qs.length;m++)meter.appendChild(el('i'));panel.appendChild(meter);
 var qtext=el('div','qtext'),opts=el('div','opts'),fb=el('div','feedback');
 panel.appendChild(qtext);panel.appendChild(opts);panel.appendChild(fb);root.appendChild(panel);
 var ball=makeBauble(friend,{friend:true});t.place(ball,[IN_BOX[0],IN_BOX[1]-90]);
 var notch=0,k=0,answers=[],locked=false;
 function bubble(txt,ms){var b=$('.bubble',t.el);if(!b){b=el('span','bubble',esc(txt));t.el.appendChild(b)}else b.textContent=txt;
  if(ms)setTimeout(function(){var x=$('.bubble',t.el);if(x)x.remove()},ms)}
 function ask(){
  var item=qs[k];locked=false;fb.textContent='';fb.className='feedback';
  ribbon.textContent='第 '+(k+1)+' / '+qs.length+' 题';
  qtext.innerHTML=esc(item.q.replace(/\{name\}/g,q.n));
  opts.className='opts'+(item.o.length===3?' one':'');opts.innerHTML='';
  item.o.forEach(function(o,idx){
   var b=el('button','opt',esc(o));
   b.onclick=function(){if(locked)return;locked=true;sfxTap();
    answers.push(idx);b.classList.add('picked');
    var right=idx===item.a;
    setTimeout(function(){
     if(right){
      notch++;b.classList.add('right');b.appendChild(el('span','flag','✅'));
      var pt=notchPoint(notch);t.place(ball,pt);t.light(notch,true);
      meter.children[notch-1].classList.add('on');t.sparkle(pt,10);sfxRight(notch);
      fb.className='feedback ok';fb.textContent=['答对！升高一层 ✨','bingo！继续往上 🎄','太懂我了 🥹','再来！'][notch%4];
      bubble(['厉害！','哇哦','继续继续','就快到顶了'][Math.min(3,Math.floor(notch/3))],1400);
     }else{
      b.classList.add('wrong');b.appendChild(el('span','flag','❌'));
      var good=opts.children[item.a];if(good&&good!==b){good.classList.add('answer');good.appendChild(el('span','flag','✅'))}
      ball.classList.add('shake');setTimeout(function(){ball.classList.remove('shake')},480);
      sfxWrong();fb.className='feedback no';fb.textContent='差一点！正确答案是「'+item.o[item.a]+'」';
      bubble('嘿嘿，猜错了',1400);
     }
     setTimeout(next,right?1150:1450);
    },380);
   };opts.appendChild(b);
  });
 }
 function next(){
  k++;
  if(k<qs.length){ask();return}
  finish();
 }
 function finish(){
  var score=scoreOf(q,answers),zone=zoneOf(score);
  t.lightAll();t.star(score>=9);
  if(score>=9){t.place(ball,TOP_HOOK);ball.classList.add('gold');t.confetti()}
  else if(zone==='front')t.place(ball,FRONT_SPOT);
  else if(zone==='bottom')t.place(ball,LOW_BRANCH);
  else t.place(ball,TINY_TWIG);
  bubble(score>=9?'你居然全答对了！':'欢迎上树 🎄',2600);
  sfxWin(zone);
  var p={name:friend,score:score,zone:zone,answers:answers,at:Date.now()};
  store('xm_played_'+id,p);
  setTimeout(function(){showResult(q,p,code,true)},1500);
 }
 ask();
}

   addFriend(quizId(code),{name:name,score:score,zone:zoneOf(score),answers:answers,at:d[3]||Date.now()});
   ov.remove();tone(784,.25,'sine',.06);toast('🎄 '+name+' 挂上树啦！');myTree();
